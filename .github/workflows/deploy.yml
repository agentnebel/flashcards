name: CI / Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint + Tests + Build validieren bei jedem Push (CI bleibt grün, auch ohne Cloudflare-Token).
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Nur dieser kleine Check sieht die Secrets. Dadurch stehen Cloudflare-Zugangsdaten
      # insbesondere `npm ci` und den ausgeführten Dependency-Skripten nicht jobweit offen.
      # Schema-Version 4 muss nach den separat ausgeführten D1-Migrationen als Repo-Variable
      # bestätigt werden; andernfalls würde neuer Worker-Code vor seinem Schema deployt.
      - name: Check deployment preconditions
        id: deploy-config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLASHCARDS_SCHEMA_VERSION: ${{ vars.FLASHCARDS_SCHEMA_VERSION }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && "$FLASHCARDS_SCHEMA_VERSION" == "4" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy übersprungen: Cloudflare-Secrets und FLASHCARDS_SCHEMA_VERSION=4 sind erforderlich."
          fi

      # Auto-Deploy NUR, wenn beide Cloudflare-Secrets existieren UND Schema-Version 4
      # nach der manuellen Migration bestätigt wurde. D1-Migrationen laufen bewusst nicht
      # bei jedem Push; ein wiederholtes ALTER TABLE wäre nicht idempotent.
      # Secrets setzen: Repo → Settings → Secrets and variables → Actions
      #   CLOUDFLARE_API_TOKEN  (Workers/R2-Schreibrechte für Deploy)
      #   CLOUDFLARE_ACCOUNT_ID (160ce2ed549950c2f2bf191ab93b3e45)
      # Variable nach erfolgreicher Migration setzen:
      #   FLASHCARDS_SCHEMA_VERSION = 4
      - name: Deploy Worker + Assets
        if: ${{ steps.deploy-config.outputs.enabled == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.110.0"
          command: deploy
